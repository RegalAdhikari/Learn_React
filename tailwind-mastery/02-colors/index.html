<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Colors</title>
</head>

<body>
  <!-- Default colors -->
  <!-- white, black, red, green, blue, orange, yellow, purple, lime, emerald, teal, cyan, indigo, violet, fuchsia, pink, rose, sky, gray, slate, zinc, neutral, stone, amber,  -->

  <!-- Text Colors -->
  <p class="text-black">Nice black</p>
  <p class="text-red-500">Nice red</p>
  <p class="text-yellow-500">Nice red</p>
  <!-- Background Colors -->

  <p class="bg-gray-400">This has a background</p>
  <!-- Text Underline -->
  <p class="underline decoration-emerald-600 text-slates-500">Nice red</p>
  <p class="underline decoration-yellow-600 text-slates-500">Yellow underline</p>

  <!-- Border Colors -->
  <input type="Enter a text" class="border border-orange-500">
  <!-- Divide Colors -->
  <div class="divide-y divide-blue-300">
    <div>Item number 1</div>
    <div>Item number 2</div>
    <div>Item number 3</div>
    <div>Item number 4</div>
    <div>Item number 5</div>
  </div>
  <!-- Outline Colors -->
  <button class="outline outline-red-500">Press me</button>
  <button class="outline outline-blue-500">Press me too</button>

  <!-- Box Shadow Colors (Opacity defaults to 100, but you can set it)-->

  <!-- Accent Colors -->
  <input type="checkbox" class="accent-red-500" id="" checked>
  <input type="checkbox" id="" checked>
  <!-- Arbitrary Colors -->
  <div class="bg-[#413FAB]">Hello man</div>
  <div class="bg-[steelblue]">Hello man</div>
</body>

</html>
